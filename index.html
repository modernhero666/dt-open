<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>打开 DEVONthink</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#6e7781; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --accent:#4c8df6; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  main { padding:24px 16px; text-align:center; max-width:420px; }
  a.btn { display:inline-block; margin-top:16px; padding:12px 22px; border-radius:10px;
          background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  p.muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1 id="h">正在打开 DEVONthink…</h1>
  <p class="muted" id="m">如果没有自动跳转，请点下面的按钮。</p>
  <a class="btn" id="go" href="#">在 DEVONthink To Go 中打开</a>
</main>
<script>
  (function () {
    var u = new URLSearchParams(location.search).get("u") || "";
    var ok = /^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$/.test(u);
    if (!ok) {
      document.getElementById("h").textContent = "链接无效";
      document.getElementById("m").textContent = "缺少或无法识别文档编号。";
      document.getElementById("go").style.display = "none";
      return;
    }
    var target = "x-devonthink-item://" + u.toUpperCase();
    document.getElementById("go").href = target;
    location.replace(target);
  })();
</script>
</body>
</html>
